name: Build ZapDPI iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show CI/CD status
        run: |
          echo "=== GitHub Actions for ZapDPI ==="
          echo "Статус: Приостановлен на неопределенный срок"
          echo ""
          echo "Причины приостановки:"
          echo "1. Xcode не работает на Windows/Linux"
          echo "2. NetworkExtension недоступен при бесплатной подписи"
          echo "3. Ограничения Apple по нативной сборке .ipa"
          echo ""
          echo "Решение: Использовать xtool для генерации проекта"
          echo " (инструкция в README.md)"
          echo ""
          echo "Альтернативные варианты:"
          echo "• Аренда Mac в облаке (MacStadium, MacInCloud, AWS EC2 Mac)"
          echo "• Ручная сборка в Xcode на macOS"

      - name: Verify project files
        run: |
          echo "=== Проверка ключевых файлов ==="
          ls -la project.yml
          ls -la xtool_config.json
          ls -la ZapDPI/Info.plist
          ls -la ZapDPI/ZapDPI.entitlements