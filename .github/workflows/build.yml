name: Build ZapDPI iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project.yml exists
        run: |
          if [ ! -f project.yml ]; then
            echo "❌ project.yml not found!"
            exit 1
          fi
          echo "✅ project.yml found"

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Show project.yml contents
        run: |
          cat project.yml

      - name: Generate Xcode project
        run: |
          xcodegen

      - name: Select latest available Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "❌ Xcode не найден в /Applications/"
            exit 1
          fi
          echo "Выбран Xcode: $XCODE_PATH"
          sudo xcode-select -switch "$XCODE_PATH"
          xcodebuild -version

      - name: Build archive
        run: |
          xcodebuild \
            -scheme ZapDPI \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/ZapDPI.xcarchive \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath ./build/ZapDPI.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath ./build/ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZapDPI-ipa
          path: ./build/ipa/
          retention-days: 7
