name: Build ZapDPI iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    # Приостановка CI/CD из-за технических ограничений Xcode на Windows/Linux
    # сбора .ipa без доступа к macOS с Xcode.
    # Инструкция по сборке через xtool — в README.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show status
        run: |
          echo "=== GitHub CI/CD for ZapDPI ==="
          echo "Статус: Приостановлен на неопределенный срок"
          echo "Причины: Отсутствие macOS с Xcode для нативной сборки .ipa"
          echo "Рекомендуемая альтернатива: Использовать инструкцию в README.md по сборке через xtool"
          echo "или аренду Mac в облаке (MacStadium, MacInCloud, AWS EC2 Mac) для сборки через Xcode."