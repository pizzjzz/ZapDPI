name: ZapDPI
options:
  bundleIdPrefix: com.zapdpi
  deploymentTarget:
    iOS: 17.0
  createIntermediateGroups: true
  xcodeVersion: "15.0"
  usesTabs: false
  indentationWidth: 2

settings:
  base:
    INFOPLIST_FILE: ZapDPI/Info.plist
    CODE_SIGN_ENTITLEMENTS: ZapDPI/ZapDPI.entitlements
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO

packages: []

targets:
  ZapDPI:
    type: application
    platform: iOS
    sources:
      - path: ZapDPI
    settings:
      PRODUCT_NAME: ZapDPI
      INFOPLIST_FILE: ZapDPI/Info.plist
      CODE_SIGN_ENTITLEMENTS: ZapDPI/ZapDPI.entitlements
    dependencies: []

schemes:
  ZapDPI:
    buildAction:
      targets:
        ZapDPI: all
    runAction:
      configuration: Debug
    archiveAction:
      configuration: Release
    profileAction:
      configuration: Release