name: ZapDPI
options:
  bundleIdPrefix: com.zapdpi
  deploymentTarget:
    iOS: 17.0
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    INFOPLIST_FILE: ZapDPI/Info.plist
    CODE_SIGN_ENTITLEMENTS: ZapDPI/ZapDPI.entitlements
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGN_STYLE: Automatic

targets:
  ZapDPI:
    type: application
    platform: iOS
    sources:
      - path: ZapDPI
    settings:
      PRODUCT_NAME: ZapDPI

schemes:
  ZapDPI:
    buildAction:
      targets:
        ZapDPI: all
    archiveAction:
      configuration: Release